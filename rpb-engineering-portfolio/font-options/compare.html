<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Font Layout Options A B C</title>
<style>
  :root{font-family:Inter,"Noto Sans TC",sans-serif;color:#0b1e40;background:#d9e1ed}
  *{box-sizing:border-box}
  body{margin:0;padding:28px}
  header{display:flex;align-items:baseline;justify-content:space-between;margin:0 auto 20px;max-width:1500px}
  h1{font-size:22px;margin:0;letter-spacing:-.04em}
  p{font-size:12px;color:#6a7890;margin:0}
  .options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:1500px;margin:auto}
  .option{background:#f7f8fa;border:1px solid #b9c9dd;box-shadow:0 8px 18px #0b1e4016;min-width:0}
  .label{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #cfd9e8;font:700 12px/1 "IBM Plex Mono",monospace;letter-spacing:.12em}
  .label b{display:grid;place-items:center;width:24px;height:24px;background:#0b1e40;color:#fff}
  iframe{display:block;width:100%;height:720px;border:0;background:#f7f8fa}
  @media(max-width:1000px){body{padding:16px}.options{grid-template-columns:1fr}.option iframe{height:620px}}
</style>
</head>
<body>
<header><h1>Font Layout Options</h1><p>同一內容，三種字體編排示意</p></header>
<main class="options">
  <section class="option"><div class="label"><b>A</b> EDITORIAL</div><iframe src="rpb-engineering-portfolio-A-editorial.html" title="Option A"></iframe></section>
  <section class="option"><div class="label"><b>B</b> TECHNICAL</div><iframe src="rpb-engineering-portfolio-B-technical.html" title="Option B"></iframe></section>
  <section class="option"><div class="label"><b>C</b> CLASSIC</div><iframe src="rpb-engineering-portfolio-C-classic.html" title="Option C"></iframe></section>
</main>
</body>
</html>
